<title>開発ノート</title>
<style>
:root {
  --bg: #f7f6f3; --card: #ffffff; --text: #26251f; --muted: #7a776d; --line: #e6e3dc;
  --accent: #2f7d5b; --accent-soft: #e3f1ea; --accent-text: #fff;
  --danger: #c2452f; --mark: #ffe58a;
  --hm0: #ebe8e1; --hm1: #b6dcc6; --hm2: #6dbb90; --hm3: #2f7d5b;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 2px 8px rgba(0,0,0,.04);
  --radius: 14px;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1b1f; --card: #25252b; --text: #ecebe6; --muted: #9c9a92; --line: #37363d;
    --accent: #5cc493; --accent-soft: #1f3a2e; --accent-text: #0f1a14;
    --danger: #ef7a63; --mark: #6b5a14;
    --hm0: #2e2e35; --hm1: #1f4a37; --hm2: #2f7d5b; --hm3: #5cc493;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1b1f; --card: #25252b; --text: #ecebe6; --muted: #9c9a92; --line: #37363d;
  --accent: #5cc493; --accent-soft: #1f3a2e; --accent-text: #0f1a14;
  --danger: #ef7a63; --mark: #6b5a14;
  --hm0: #2e2e35; --hm1: #1f4a37; --hm2: #2f7d5b; --hm3: #5cc493;
  --shadow: none; color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text); font-family: var(--font);
  font-size: 16px; line-height: 1.65; -webkit-font-smoothing: antialiased;
  padding-bottom: calc(84px + env(safe-area-inset-bottom));
}
a { color: var(--accent); text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }
.muted { color: var(--muted); }
.small { font-size: .82rem; }
.center { text-align: center; }
mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }
code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .88em; background: var(--hm0); padding: .1em .35em; border-radius: 5px; }

/* ヘッダー */
.topbar {
  position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 8px;
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line);
}
.topbar h1 { flex: 1; margin: 0; font-size: 1.05rem; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar .back, .icon-btn { font-size: 1.25rem; width: 36px; height: 36px; display: grid; place-items: center; border-radius: 10px; }
.icon-btn:hover, .topbar .back:hover { background: var(--line); }

.view { max-width: 720px; margin: 0 auto; padding: 16px; }

/* 下部ナビ（親指で届く位置に主要操作） */
.nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 10; display: flex; justify-content: space-around; align-items: center;
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); background: var(--card); border-top: 1px solid var(--line);
}
.nav a { display: flex; flex-direction: column; align-items: center; min-width: 60px; padding: 4px 6px; border-radius: 10px; color: var(--muted); }
.nav a span { font-size: 1.3rem; line-height: 1.2; filter: grayscale(1); opacity: .7; }
.nav a small { font-size: .68rem; }
.nav a.active { color: var(--accent); font-weight: 700; }
.nav a.active span { filter: none; opacity: 1; }
.fab {
  width: 56px; height: 56px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-text);
  font-size: 2rem; line-height: 1; margin-top: -26px; box-shadow: 0 4px 14px rgba(47,125,91,.35); cursor: pointer;
}
.fab:active { transform: scale(.95); }

/* カード */
.card { display: block; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow); color: inherit; }
.card h3 { margin: 0 0 10px; font-size: 1rem; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.card-head h3 { margin: 0; }
.row { display: flex; gap: 8px; align-items: center; }
.row.wrap { flex-wrap: wrap; margin-bottom: 14px; }
.row > select { flex: 1; min-width: 0; }
.spacer { flex: 1; }

/* ボタン */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 42px; padding: 8px 16px;
  border-radius: 10px; border: 1px solid var(--line); background: var(--card); cursor: pointer; font-weight: 600; font-size: .95rem; color: var(--text);
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); border-color: var(--danger); background: transparent; }
.btn.small { min-height: 34px; padding: 4px 12px; font-size: .85rem; }
.btn.block { width: 100%; margin-bottom: 14px; }
.link-btn { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 4px 0; font-size: .88rem; }
.link-btn.danger { color: var(--danger); }

select, input[type=search], input:not([type]), textarea, .field input {
  width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 9px 12px; outline: none;
}
select { min-height: 42px; }
select:focus, input:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.field { display: block; margin-bottom: 12px; }
.field span { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 4px; }

/* クイック記録 */
.capture textarea { resize: vertical; margin: 10px 0; font-size: 1rem; }
.mood-row { display: flex; gap: 6px; }
.mood {
  flex: 1; display: flex; flex-direction: column; align-items: center; padding: 6px 0; border: 1px solid var(--line);
  border-radius: 12px; background: transparent; cursor: pointer; transition: transform .1s;
}
.mood span { font-size: 1.5rem; line-height: 1.2; filter: grayscale(.6); opacity: .75; }
.mood small { font-size: .65rem; color: var(--muted); }
.mood.on { border-color: var(--accent); background: var(--accent-soft); }
.mood.on span { filter: none; opacity: 1; }
.mood:active { transform: scale(.94); }
.mood-row.compact { margin: 8px 0; }
.mood-row.compact .mood { font-size: 1.3rem; padding: 4px 0; filter: grayscale(.6); opacity: .7; }
.mood-row.compact .mood.on { filter: none; opacity: 1; }

.welcome { background: var(--accent-soft); border-color: transparent; }
.welcome p { margin: 0 0 12px; }
.prompt { font-size: 1.05rem; font-weight: 600; margin: 4px 0 12px; }

/* 草 */
.heatmap { display: grid; grid-template-rows: repeat(7, 1fr); gap: 3px; margin: 6px 0; }
.hm { aspect-ratio: 1; border-radius: 3px; background: var(--hm0); }
.hm.l1 { background: var(--hm1); } .hm.l2 { background: var(--hm2); } .hm.l3 { background: var(--hm3); }
.hm.today { outline: 2px solid var(--text); outline-offset: -1px; }
.hm.future { opacity: .25; }

/* ノート一覧 */
.note-item { display: flex; gap: 10px; align-items: flex-start; padding: 10px 6px; border-bottom: 1px solid var(--line); color: inherit; border-radius: 8px; }
.note-item:last-child { border-bottom: 0; }
.note-item:hover { background: var(--bg); }
.ni-icon { font-size: 1.2rem; line-height: 1.5; }
.ni-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.ni-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ni-snip { color: var(--muted); font-size: .88rem; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.ni-meta { color: var(--muted); font-size: .75rem; }
.ni-mood { font-size: 1.2rem; }
.tag { color: var(--accent); font-size: .9em; }
#results .note-item { background: var(--card); border: 1px solid var(--line); margin-bottom: 6px; padding: 10px 12px; }
.day-sep { font-size: .78rem; color: var(--muted); font-weight: 700; margin: 14px 2px 6px; }
.search-bar { position: sticky; top: 57px; z-index: 5; background: var(--bg); padding: 4px 0 8px; }
.search-bar input { font-size: 1rem; padding: 11px 14px; }
.filters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.filters select { font-size: .82rem; padding: 6px 8px; min-height: 38px; }
.otd-label { font-size: .78rem; font-weight: 700; color: var(--muted); margin-top: 6px; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 12px; border-radius: 999px; background: var(--accent-soft); color: var(--text); border: 0; font-size: .85rem; cursor: pointer; }
.chip small { color: var(--muted); }
.badge { font-size: .7rem; padding: 2px 8px; border-radius: 999px; background: var(--hm0); color: var(--muted); font-weight: 600; vertical-align: middle; }

/* ボトムシート */
.sheet { position: fixed; inset: 0; z-index: 30; display: flex; align-items: flex-end; justify-content: center; }
.sheet-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.4); }
.sheet-panel {
  position: relative; width: 100%; max-width: 560px; max-height: 88vh; overflow: auto; background: var(--card);
  border-radius: 18px 18px 0 0; padding: 20px 16px calc(16px + env(safe-area-inset-bottom)); animation: up .18s ease-out;
}
.sheet-panel h3 { margin: 0 0 14px; }
@media (min-width: 640px) { .sheet { align-items: center; } .sheet-panel { border-radius: 18px; } }
@keyframes up { from { transform: translateY(30px); opacity: 0; } }
.type-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.type-card { display: flex; flex-direction: column; align-items: flex-start; text-align: left; gap: 2px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); cursor: pointer; }
.type-card:hover { border-color: var(--accent); }
.type-card:last-child:nth-child(odd) { grid-column: span 2; }
.tc-icon { font-size: 1.5rem; }
.tc-label { font-weight: 700; }
.tc-hint { font-size: .74rem; color: var(--muted); line-height: 1.4; }

/* エディタ */
.editor .e-title { font-size: 1.3rem; font-weight: 700; border: 0; background: transparent; padding: 4px 0; box-shadow: none; }
.e-meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.e-meta select { width: auto; flex: 0 1 auto; font-size: .85rem; min-height: 36px; padding: 4px 8px; }
.e-tags { font-size: .9rem; margin-bottom: 8px; }
.e-toolbar { position: sticky; top: 57px; z-index: 4; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 0; background: var(--bg); }
.tools { display: flex; gap: 2px; overflow-x: auto; }
.tools button { min-width: 38px; height: 36px; border: 1px solid var(--line); background: var(--card); border-radius: 8px; cursor: pointer; font-size: .9rem; }
.seg { flex: none; white-space: nowrap; display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--card); }
.seg button { border: 0; background: transparent; padding: 6px 14px; cursor: pointer; font-size: .88rem; min-height: 36px; }
.seg button.on { background: var(--accent); color: var(--accent-text); font-weight: 700; }
.seg.wide { display: flex; } .seg.wide button { flex: 1; padding: 8px 4px; }
.e-body { min-height: 240px; resize: none; line-height: 1.75; font-size: 1rem; background: var(--card); padding: 14px; overflow: hidden; }
.e-preview { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 6px 16px; min-height: 160px; }
.e-foot { display: flex; align-items: center; gap: 8px; margin: 10px 0 18px; }
.banner { background: var(--hm0); padding: 8px 12px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: .9rem; }
#backlinks h4 { margin: 8px 0; font-size: .9rem; color: var(--muted); }

/* 集中モード：UIを消して文字だけに */
body.focus .topbar, body.focus .nav, body.focus .e-meta, body.focus .mood-row, body.focus .e-tags, body.focus .e-foot, body.focus #backlinks { display: none; }
body.focus .e-toolbar { top: 0; }
body.focus .e-body { border: 0; background: transparent; box-shadow: none; font-size: 1.08rem; }
body.focus { padding-bottom: 0; }

/* Markdown 表示 */
.md h2 { font-size: 1.05rem; margin: 18px 0 6px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
.md h3 { font-size: 1rem; margin: 14px 0 4px; }
.md h4, .md h5 { font-size: .95rem; margin: 12px 0 4px; }
.md p { margin: 6px 0; }
.md ul, .md ol { padding-left: 1.4em; margin: 6px 0; }
.md ul.tasks { list-style: none; padding-left: .2em; }
.md li.task.done span { color: var(--muted); text-decoration: line-through; }
.md input[type=checkbox] { width: 1.05em; height: 1.05em; vertical-align: -2px; accent-color: var(--accent); }
.md blockquote { margin: 8px 0; padding: 4px 12px; border-left: 3px solid var(--accent); color: var(--muted); }
.md pre { background: var(--bg); padding: 10px; border-radius: 8px; overflow-x: auto; }
.md pre code { background: none; padding: 0; }
.md hr { border: 0; border-top: 1px solid var(--line); }
.wikilink { background: var(--accent-soft); padding: 0 4px; border-radius: 4px; }

/* プロジェクト */
.project-card h3 { margin-bottom: 4px; }
.project-card p { margin: 2px 0; }
.project-card.archived { opacity: .7; }
.purpose-card { border-left: 4px solid var(--accent); }
.purpose { margin: 0; white-space: normal; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
.stats > div { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px; text-align: center; }
.stats.inner > div { background: var(--bg); border: 0; }
.stats b { display: block; font-size: 1.4rem; }
.stats small { color: var(--muted); font-size: .75rem; }
.up { color: var(--accent); } .down { color: var(--danger); }
.timeline { position: relative; padding-left: 4px; }
.tl-month { font-weight: 700; font-size: .85rem; margin: 14px 0 6px; color: var(--muted); }
.tl-item { display: flex; gap: 10px; padding: 6px 0; color: inherit; position: relative; }
.tl-item::before { content: ''; position: absolute; left: 15px; top: 34px; bottom: -6px; width: 2px; background: var(--line); }
.tl-item:last-child::before { display: none; }
.tl-dot { width: 32px; height: 32px; flex: none; display: grid; place-items: center; border-radius: 50%; background: var(--bg); border: 1px solid var(--line); font-size: .95rem; }
.t-purpose .tl-dot, .t-decision .tl-dot { background: var(--accent-soft); border-color: var(--accent); }
.tl-body { display: flex; flex-direction: column; min-width: 0; }
.tl-date { font-size: .75rem; color: var(--muted); }
.tl-title { font-weight: 600; }

/* 気付き */
.chart { width: 100%; height: auto; }
.chart .grid line { stroke: var(--line); stroke-dasharray: 3 3; }
.chart .grid text { font-size: 10px; }
.chart path { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.chart circle { fill: var(--accent); }
.chart-x { display: flex; justify-content: space-between; padding: 0 18px; }
.bars { display: flex; flex-direction: column; gap: 6px; }
.bar-row { display: grid; grid-template-columns: minmax(90px, 35%) 1fr 40px; gap: 8px; align-items: center; font-size: .88rem; }
.bar-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-track { height: 10px; background: var(--hm0); border-radius: 5px; overflow: hidden; }
.bar { display: block; height: 100%; border-radius: 5px; }
.bar.pos { background: var(--accent); } .bar.neg { background: var(--danger); }
.bar-val { text-align: right; font-variant-numeric: tabular-nums; }
.task-list { list-style: none; padding: 0; margin: 0; }
.task-list li { display: flex; flex-direction: column; padding: 8px 0; border-bottom: 1px solid var(--line); }
.task-list li:last-child { border-bottom: 0; }
.task-list label { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
.task-list input { margin-top: 5px; accent-color: var(--accent); width: 1.1em; height: 1.1em; }
.task-list li.done span { text-decoration: line-through; color: var(--muted); }
.task-list a { padding-left: 26px; }

.toast {
  position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); z-index: 40;
  background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: .9rem; opacity: 0; pointer-events: none; transition: .2s; max-width: calc(100% - 32px);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (min-width: 720px) {
  .view { padding: 24px 16px; }
}

.btn:disabled { opacity: .45; cursor: not-allowed; }
.loading { padding: 40px 0; }

/* claude.ai のアーティファクトとして表示するとき */
body.embedded .topbar { top: env(safe-area-inset-top, 0px); padding-top: 10px; }
body.embedded::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 11; background: var(--bg); }

</style>
<header class="topbar">
    <a class="back" href="#/home" aria-label="ホーム">📓</a>
    <h1 id="title">開発ノート</h1>
    <a class="icon-btn" href="#/settings" aria-label="設定">⚙️</a>
  </header>

  <main id="view" class="view" aria-live="polite"></main>

  <nav class="nav" aria-label="メイン">
    <a href="#/home" data-nav="home"><span>🏠</span><small>ホーム</small></a>
    <a href="#/notes" data-nav="notes"><span>📚</span><small>ノート</small></a>
    <button id="fab" class="fab" aria-label="新しいノート">＋</button>
    <a href="#/projects" data-nav="projects"><span>🚀</span><small>プロジェクト</small></a>
    <a href="#/insights" data-nav="insights"><span>💡</span><small>気付き</small></a>
  </nav>

  <div id="sheet" class="sheet" hidden></div>
  <div id="toast" class="toast" role="status"></div>
<script type="module">
// 保存先の切り替え：
//  - claude.ai のアーティファクトとして開いた場合 → Claude アカウントの個人用ストア（db capability）
//  - それ以外（GitHub Pages / ローカル） → ブラウザの IndexedDB
// どちらも同じインターフェース（all / put / del / clear / bulkPut）で扱う。

// ---------- IndexedDB ----------
const DB_NAME = 'devnote';
const DB_VERSION = 1;
let idbPromise = null;

function idbOpen() {
  if (idbPromise) return idbPromise;
  idbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const d = req.result;
      if (!d.objectStoreNames.contains('notes')) d.createObjectStore('notes', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('projects')) d.createObjectStore('projects', { keyPath: 'id' });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return idbPromise;
}

function idbTx(store, mode, fn) {
  return idbOpen().then(d => new Promise((resolve, reject) => {
    const t = d.transaction(store, mode);
    const s = t.objectStore(store);
    let result;
    Promise.resolve(fn(s)).then(r => { result = r; });
    t.oncomplete = () => resolve(result);
    t.onerror = () => reject(t.error);
    t.onabort = () => reject(t.error);
  }));
}
const reqP = req => new Promise((res, rej) => { req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error); });

const idbBackend = {
  mode: 'local',
  all: store => idbTx(store, 'readonly', s => reqP(s.getAll())),
  put: (store, obj) => idbTx(store, 'readwrite', s => { s.put(obj); return obj; }),
  del: (store, id) => idbTx(store, 'readwrite', s => { s.delete(id); }),
  clear: store => idbTx(store, 'readwrite', s => { s.clear(); }),
  bulkPut: (store, list) => idbTx(store, 'readwrite', s => { list.forEach(o => s.put(o)); }),
};

// ---------- Claude（アーティファクトの db capability） ----------
// 本人だけが読める data/users/<id> コレクションに、kind: 'notes' | 'projects' 付きで保存する。
function claudeBackend(cdb, uid) {
  const col = cdb.collection(`data/users/${uid}`);
  const queues = new Map(); // 同じドキュメントへの書き込みは1つずつ順番に
  const serial = (id, fn) => {
    const prev = queues.get(id) || Promise.resolve();
    const next = prev.catch(() => {}).then(fn);
    queues.set(id, next);
    next.finally(() => { if (queues.get(id) === next) queues.delete(id); });
    return next;
  };
  const retry = async fn => {
    try { return await fn(); }
    catch (e) {
      if (e?.code !== 'unavailable') throw e;
      await new Promise(r => setTimeout(r, 400 + Math.random() * 600));
      return fn();
    }
  };
  const strip = d => { const { kind, ...rest } = d.data(); return rest; };
  const backend = {
    mode: 'claude',
    all: async store => (await retry(() => col.where('kind', '==', store).get())).docs.map(strip),

// 最小限の Markdown レンダラー（HTMLはすべてエスケープしてから変換）
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function inline(text) {
  let s = esc(text);
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return `\u0000${codes.length - 1}\u0000`; });
  s = s.replace(/\[\[([^\]]+)\]\]/g, (_, t) => `<a href="#" class="wikilink" data-title="${t}">${t}</a>`);
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/(^|[\s(])(https?:\/\/[^\s<]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>');
  s = s.replace(/~~([^~]+)~~/g, '<del>$1</del>');
  s = s.replace(/(^|\s)#([^\s#.,、。!?！？]+)/g, '$1<span class="tag">#$2</span>');
  s = s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codes[i]}</code>`);
  return s;
}

function render(md) {
  const lines = String(md ?? '').split('\n');
  let html = '';
  let list = null; // 'ul' | 'ol'
  let inCode = false, code = [];
  const close = () => { if (list) { html += `</${list}>`; list = null; } };

  lines.forEach((line, idx) => {
    if (/^```/.test(line)) {
      if (inCode) { html += `<pre><code>${esc(code.join('\n'))}</code></pre>`; code = []; inCode = false; }
      else { close(); inCode = true; }
      return;
    }
    if (inCode) { code.push(line); return; }

    let m;
    if ((m = line.match(/^(#{1,4})\s+(.*)$/))) { close(); const n = m[1].length + 1; html += `<h${n}>${inline(m[2])}</h${n}>`; return; }
    if ((m = line.match(/^\s*[-*]\s+\[( |x|X)\]\s?(.*)$/))) {
      if (list !== 'ul') { close(); html += '<ul class="tasks">'; list = 'ul'; }
      const done = m[1] !== ' ';
      html += `<li class="task${done ? ' done' : ''}"><input type="checkbox" data-line="${idx}" ${done ? 'checked' : ''}> <span>${inline(m[2])}</span></li>`;
      return;
    }
    if ((m = line.match(/^\s*[-*]\s+(.*)$/))) { if (list !== 'ul') { close(); html += '<ul>'; list = 'ul'; } html += `<li>${inline(m[1])}</li>`; return; }
    if ((m = line.match(/^\s*\d+\.\s+(.*)$/))) { if (list !== 'ol') { close(); html += '<ol>'; list = 'ol'; } html += `<li>${inline(m[1])}</li>`; return; }
    if ((m = line.match(/^>\s?(.*)$/))) { close(); html += `<blockquote>${inline(m[1])}</blockquote>`; return; }
    if (/^---+$/.test(line.trim())) { close(); html += '<hr>'; return; }
    if (!line.trim()) { close(); return; }
    close();
    html += `<p>${inline(line)}</p>`;
  });
  if (inCode) html += `<pre><code>${esc(code.join('\n'))}</code></pre>`;
  close();
  return html;
}

// 気付き（インサイト）の集計ロジック
const dayKey = d => {
  const x = new Date(d);
  return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`;
};

function countByDay(notes) {
  const map = new Map();
  for (const n of notes) { const k = dayKey(n.createdAt); map.set(k, (map.get(k) || 0) + 1); }
  return map;
}

// 週の始まり（月曜）
function weekStart(d = new Date()) {
  const x = new Date(d); x.setHours(0, 0, 0, 0);
  x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
  return x;
}

// 今週記録した日数
function daysThisWeek(notes) {
  const start = weekStart().getTime();
  return new Set(notes.filter(n => n.createdAt >= start).map(n => dayKey(n.createdAt))).size;
}

// 週目標を達成した週が何週続いているか（今週は達成済みなら含める）
function weekStreak(notes, goal) {
  const byWeek = new Map();
  for (const n of notes) {
    const w = weekStart(n.createdAt).getTime();
    if (!byWeek.has(w)) byWeek.set(w, new Set());
    byWeek.get(w).add(dayKey(n.createdAt));
  }
  let streak = 0;
  const cur = weekStart();
  if ((byWeek.get(cur.getTime())?.size || 0) >= goal) streak++;
  const w = new Date(cur);
  for (;;) {
    w.setDate(w.getDate() - 7);
    if ((byWeek.get(w.getTime())?.size || 0) >= goal) streak++; else break;
  }
  return streak;
}

// 過去の今日（1週間前・1か月前・半年前・1年前…）
function onThisDay(notes, now = new Date()) {
  const targets = [
    { label: '1週間前', d: new Date(now.getFullYear(), now.getMonth(), now.getDate() - 7) },
    { label: '1か月前', d: new Date(now.getFullYear(), now.getMonth() - 1, now.getDate()) },
    { label: '3か月前', d: new Date(now.getFullYear(), now.getMonth() - 3, now.getDate()) },
    { label: '半年前', d: new Date(now.getFullYear(), now.getMonth() - 6, now.getDate()) },
  ];
  for (let y = 1; y <= 5; y++) targets.push({ label: `${y}年前`, d: new Date(now.getFullYear() - y, now.getMonth(), now.getDate()) });
  const out = [];
  for (const t of targets) {
    const k = dayKey(t.d);
    const hit = notes.filter(n => dayKey(n.createdAt) === k);
    if (hit.length) out.push({ label: t.label, notes: hit });
  }
  return out;
}

// 日ごとの気分の平均（直近 days 日）
function moodSeries(notes, days = 30) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const series = [];
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date(today); d.setDate(d.getDate() - i);
    const k = dayKey(d);
    const ms = notes.filter(n => n.mood && dayKey(n.createdAt) === k).map(n => n.mood);
    series.push({ day: k, avg: ms.length ? ms.reduce((a, b) => a + b, 0) / ms.length : null });
  }
  return series;
}

// タグ別の気分平均（2件以上あるタグのみ）
function tagMood(notes) {
  const withMood = notes.filter(n => n.mood);
  if (withMood.length < 3) return [];
  const overall = withMood.reduce((a, n) => a + n.mood, 0) / withMood.length;
  const map = new Map();
  for (const n of withMood) for (const t of n.tags || []) {
    if (!map.has(t)) map.set(t, []);
    map.get(t).push(n.mood);
  }
  return [...map].filter(([, v]) => v.length >= 2)
    .map(([tag, v]) => { const avg = v.reduce((a, b) => a + b, 0) / v.length; return { tag, count: v.length, avg, diff: avg - overall }; })
    .sort((a, b) => b.diff - a.diff);
}

// よく出る言葉（Intl.Segmenter で日本語を単語に分割）
const STOP = new Set(['こと', 'もの', 'ため', 'よう', 'これ', 'それ', 'あれ', 'ここ', 'そこ', 'とき', 'ところ', 'やったこと', 'わかったこと', '次にやること', 'ハマったこと', '感じ', 'さん', 'して', 'する', 'した', 'ある', 'いる', 'なる', 'できる', '思う', '今日', '自分', 'Liked', 'Learned', 'Lacked', 'Longed', 'for', 'Try', 'Stop', 'the', 'and']);
function topWords(notes, limit = 20) {
  const freq = new Map();
  const seg = typeof Intl !== 'undefined' && Intl.Segmenter ? new Intl.Segmenter('ja', { granularity: 'word' }) : null;
  for (const n of notes) {
    const text = `${n.title || ''}\n${n.body || ''}`.replace(/^#+.*$/gm, '').replace(/\[[ xX]\]/g, '');
    const words = seg ? [...seg.segment(text)].filter(s => s.isWordLike).map(s => s.segment) : text.split(/[\s、。,.!?！？「」()（）]+/);
    for (const w of words) {
      if (w.length < 2 || STOP.has(w) || /^[぀-ゟ]+$/.test(w) || /^\d+$/.test(w)) continue;
      freq.set(w, (freq.get(w) || 0) + 1);
    }
  }
  return [...freq].filter(([, c]) => c >= 2).sort((a, b) => b[1] - a[1]).slice(0, limit);
}

// 未完了の「次にやること / Try」（チェックボックス）を集める
function openTasks(notes) {

      if (m && m[1].trim()) out.push({ note: n, line: idx, text: m[1].trim() });
    });
  }
  return out.sort((a, b) => b.note.createdAt - a.note.createdAt);
}

return { dayKey, countByDay, weekStart, daysThisWeek, weekStreak, onThisDay, moodSeries, tagMood, topWords, openTasks };

function heatmap(notes, weeks = 18) {
  const counts = ins.countByDay(notes);
  const start = ins.weekStart(); start.setDate(start.getDate() - (weeks - 1) * 7);
  const today = ins.dayKey(new Date());
  let cells = '';
  for (let w = 0; w < weeks; w++) for (let d = 0; d < 7; d++) {
    const day = new Date(start); day.setDate(start.getDate() + w * 7 + d);
    const k = ins.dayKey(day);
    const future = day > new Date();
    const c = counts.get(k) || 0;
    const lv = c === 0 ? 0 : c === 1 ? 1 : c <= 3 ? 2 : 3;
    cells += `<i class="hm l${lv}${k === today ? ' today' : ''}${future ? ' future' : ''}" style="grid-column:${w + 1};grid-row:${d + 1}" title="${k}: ${c}件"></i>`;
  }
  return `<div class="heatmap" style="grid-template-columns:repeat(${weeks},1fr)">${cells}</div>`;
}

  </div>
  <div class="filters">
    <select id="f-type"><option value="">すべての種類</option>${Object.entries(TYPES).map(([k, t]) => `<option value="${k}" ${listState.type === k ? 'selected' : ''}>${t.icon} ${t.label}</option>`).join('')}</select>

      (!listState.project || n.projectId === listState.project) &&

      (!q || `${noteTitle(n)}\n${n.body}\n${allTags(n).join(' ')}`.toLowerCase().includes(q))
    ).sort((a, b) => b.createdAt - a.createdAt);

  $('#f-type').onchange = e => { listState.type = e.target.value; draw(); };
  $('#f-project').onchange = e => { listState.project = e.target.value; draw(); };

let leaveEditor = null;
let flushEditor = null;
function findByTitle(title) {

}
async function openWikiLink(title) {

function renderEditor(id, params) {
  const n = state.notes.find(x => x.id === id);
  if (!n) { view.innerHTML = '<p class="muted center">ノートが見つかりません</p>'; setTitle('ノート'); return; }
  setNav('notes');
  setTitle(TYPES[n.type]?.label || 'ノート');
  const template = TYPES[n.type]?.body || '';
  let mode = params.get('new') || !n.body || n.body === template ? 'edit' : 'preview';

  view.innerHTML = `
  <div class="editor ${n.deletedAt ? 'is-trash' : ''}">
    ${n.deletedAt ? `<div class="banner">このノートはゴミ箱にあります <button class="btn small" id="restore">元に戻す</button></div>` : ''}
    <input id="e-title" class="e-title" placeholder="${esc(noteTitle({ ...n, title: '' }))}" value="${esc(n.title)}" aria-label="タイトル">
    <div class="e-meta">
      <select id="e-type" aria-label="種類">${Object.entries(TYPES).map(([k, t]) => `<option value="${k}" ${n.type === k ? 'selected' : ''}>${t.icon} ${t.label}</option>`).join('')}</select>
      <select id="e-project" aria-label="プロジェクト">${projectOptions(n.projectId)}</select>
      <span class="muted small">${fmtDate(n.createdAt)} ${fmtTime(n.createdAt)}</span>
    </div>
    <div class="mood-row compact">${MOODS.map(m => `<button class="mood ${n.mood === m.v ? 'on' : ''}" data-mood="${m.v}" title="${m.l}">${m.e}</button>`).join('')}</div>
    <input id="e-tags" class="e-tags" placeholder="タグ（スペース区切り） 例: UI バグ 設計" value="${esc((n.tags || []).join(' '))}" aria-label="タグ">
    <div class="e-toolbar">
      <div class="seg"><button data-mode="edit">編集</button><button data-mode="preview">表示</button></div>
      <div class="tools">
        <button data-ins="## " title="見出し">H</button>
        <button data-ins="- " title="リスト">•</button>
        <button data-ins="- [ ] " title="チェック">☑</button>
        <button data-wrap="**" title="太字"><b>B</b></button>
        <button data-wrap="[[|]]" title="ノートへのリンク">[[ ]]</button>
        <button id="focus" title="集中モード">⛶</button>
      </div>
    </div>
    <textarea id="e-body" class="e-body" placeholder="${esc(TYPES[n.type]?.hint || '')}">${esc(n.body)}</textarea>
    <div id="e-preview" class="e-preview md"></div>
    <div class="e-foot"><span id="save-state" class="muted small">保存済み</span>
      <span class="spacer"></span>
      ${n.deletedAt ? '<button class="btn danger small" id="purge">完全に削除</button>' : '<button class="btn ghost small" id="del">🗑 ゴミ箱へ</button>'}
    </div>
    <section id="backlinks"></section>
  </div>`;

  const body = $('#e-body'), preview = $('#e-preview'), titleEl = $('#e-title');
  const autoGrow = () => { body.style.height = 'auto'; body.style.height = Math.max(240, body.scrollHeight + 4) + 'px'; };
  const setMode = m => {
    mode = m;
    $$('.seg button', view).forEach(b => b.classList.toggle('on', b.dataset.mode === m));
    $('.tools', view).style.visibility = m === 'edit' ? 'visible' : 'hidden';
    body.hidden = m !== 'edit'; preview.hidden = m === 'edit';
    if (m === 'preview') preview.innerHTML = render(n.body) || '<p class="muted">（空のノート）</p>';
    else { autoGrow(); }
  };
  let timer = null;
  const persist = async () => {
    clearTimeout(timer); timer = null;
    n.title = titleEl.value;
    n.body = body.value;
    n.tags = $('#e-tags').value.split(/[\s,、#]+/).map(s => s.trim()).filter(Boolean);
    await saveNote(n);
    $('#save-state').textContent = `保存済み ${fmtTime(n.updatedAt)}`;
  };
  const schedule = () => { $('#save-state').textContent = '編集中…'; clearTimeout(timer); timer = setTimeout(persist, 500); };

  titleEl.oninput = schedule;
  body.oninput = () => { autoGrow(); schedule(); };
  $('#e-tags').oninput = schedule;
  $('#e-type').onchange = async e => {
    const old = n.type; n.type = e.target.value;
    if (body.value.trim() === '' || body.value === TYPES[old]?.body) { body.value = TYPES[n.type].body; autoGrow(); }
    setTitle(TYPES[n.type].label); await persist();
  };
  $('#e-project').onchange = async e => { n.projectId = e.target.value; settings.lastProject = n.projectId; saveSettings(); await persist(); };
  $$('.mood', view).forEach(b => b.onclick = async () => {
    n.mood = n.mood === +b.dataset.mood ? null : +b.dataset.mood;
    $$('.mood', view).forEach(x => x.classList.toggle('on', +x.dataset.mood === n.mood));
    await persist();
  });
  $$('.seg button', view).forEach(b => b.onclick = async () => { if (timer) await persist(); setMode(b.dataset.mode); });
  $$('[data-ins]', view).forEach(b => b.onclick = () => {
    const s = body.selectionStart, ls = body.value.lastIndexOf('\n', s - 1) + 1;
    body.setRangeText(b.dataset.ins, ls, ls, 'end'); body.focus(); schedule();
  });
  $$('[data-wrap]', view).forEach(b => b.onclick = () => {
    const [l, r = l] = b.dataset.wrap.split('|');
    const s = body.selectionStart, e = body.selectionEnd, sel = body.value.slice(s, e);
    body.setRangeText(l + sel + r, s, e, 'select');
    if (!sel) body.setSelectionRange(s + l.length, s + l.length);
    body.focus(); schedule();
  });
  $('#focus').onclick = () => document.body.classList.toggle('focus');
  preview.onclick = async e => {
    const a = e.target.closest('.wikilink');
    if (a) { e.preventDefault(); await persist(); openWikiLink(a.dataset.title); return; }
    const cb = e.target.closest('input[type=checkbox][data-line]');
    if (cb) {
      const lines = n.body.split('\n'); const i = +cb.dataset.line;
      lines[i] = lines[i].replace(/\[( |x|X)\]/, cb.checked ? '[x]' : '[ ]');
      body.value = n.body = lines.join('\n'); await persist(); setMode('preview');
    }
  };
  $('#del')?.addEventListener('click', async () => {
    n.deletedAt = Date.now(); await persist(); toast('ゴミ箱に移しました（設定から戻せます）'); go('#/notes');
  });
  $('#restore')?.addEventListener('click', async () => { n.deletedAt = null; await persist(); renderEditor(id, params); toast('元に戻しました'); });
  $('#purge')?.addEventListener('click', async () => {
    if (!await ask('このノートを完全に削除しますか？元に戻せません。', { ok: '完全に削除', danger: true })) return;
    await db.del('notes', n.id); state.notes = state.notes.filter(x => x.id !== n.id); go('#/settings');
  });

  // バックリンク
  const myTitle = noteTitle(n).toLowerCase();
  const back = live().filter(x => x.id !== n.id && wikiLinks(x.body).some(t => t.toLowerCase() === myTitle));
  $('#backlinks').innerHTML = back.length ? `<h4>🔗 このノートを参照しているノート</h4>${back.map(x => noteItem(x)).join('')}` : '';

  setMode(mode);
  if (params.get('new')) {
    if (n.title) { body.focus(); const p = body.value.indexOf('- ') + 2; if (p > 1) body.setSelectionRange(p, p); }
    else titleEl.focus();
  }

  // 画面を離れるとき：未保存の変更を保存し、作っただけで何も書いていない新規ノートは破棄
  const initial = { title: n.title, body: n.body };
  const isNew = !!params.get('new');
  flushEditor = () => timer && persist();
  leaveEditor = async () => {
    flushEditor = null;
    document.body.classList.remove('focus');
    if (timer) await persist();
    if (isNew && !n.deletedAt && n.title === initial.title && n.body === initial.body && !n.mood && !(n.tags || []).length) {
      await db.del('notes', n.id); state.notes = state.notes.filter(x => x.id !== n.id);
    }
  };
}

  const moods = ns.filter(n => n.mood).map(n => n.mood);
  const counts = Object.keys(TYPES).map(k => [k, ns.filter(n => n.type === k).length]).filter(([, c]) => c);

  let tl = '', lastMonth = '';
  for (const n of [...ns].reverse()) {

      <span class="tl-dot">${TYPES[n.type]?.icon}</span>
      <span class="tl-body"><span class="tl-date">${fmtShort(n.createdAt)} ${n.mood ? moodEmoji(n.mood) : ''}</span>
      <span class="tl-title">${esc(noteTitle(n))}</span>

  view.innerHTML = `
  <section class="card purpose-card">
    <div class="card-head"><h3>🎯 目的</h3><button class="link-btn" id="edit-project">編集</button></div>

  </section>
  <section class="stats">
    <div><b>${elapsed}</b><small>日目</small></div>
    <div><b>${ns.length}</b><small>ノート</small></div>
    <div><b>${moods.length ? (moods.reduce((a, b) => a + b, 0) / moods.length).toFixed(1) : '-'}</b><small>平均気分</small></div>
  </section>

  <section class="card">
    <h3>🧭 経緯（タイムライン）</h3>
    <div class="timeline">${tl || '<p class="muted">まだ記録がありません。最初の「目的・動機」ノートを書いてみましょう。</p>'}</div>
  </section>`;
  $('#edit-project').onclick = () => openProjectSheet(p);
  $('#p-new').onclick = () => openNewNoteSheet({ projectId: id });
  $('#p-archive').onclick = async () => { p.archived = !p.archived; await saveProject(p); renderProject(id); };
}

// ---------- 気付き ----------
function moodChart(series) {
  const W = 320, H = 120, P = 18;
  const pts = series.map((s, i) => s.avg == null ? null : [P + i * (W - 2 * P) / (series.length - 1), H - P - (s.avg - 1) * (H - 2 * P) / 4]);
  let path = '', pen = false;
  pts.forEach(p => { if (!p) { pen = false; return; } path += `${pen ? 'L' : 'M'}${p[0].toFixed(1)},${p[1].toFixed(1)} `; pen = true; });
  const dots = pts.map((p, i) => p ? `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3"><title>${series[i].day}: ${series[i].avg.toFixed(1)}</title></circle>` : '').join('');
  const grid = [1, 3, 5].map(v => { const y = H - P - (v - 1) * (H - 2 * P) / 4; return `<line x1="${P}" x2="${W - P}" y1="${y}" y2="${y}"/><text x="2" y="${y + 4}">${moodEmoji(v)}</text>`; }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="直近30日の気分の推移"><g class="grid">${grid}</g><path d="${path}"/>${dots}</svg>
    <div class="chart-x muted small"><span>${series[0].day.slice(5)}</span><span>今日</span></div>`;
}

function renderInsights() {
  setTitle('気付き'); setNav('insights');
  const notes = live();
  const series = ins.moodSeries(notes, 30);
  const hasMood = series.some(s => s.avg != null);
  const tm = ins.tagMood(notes);
  const words = ins.topWords(notes.filter(n => n.createdAt > Date.now() - 30 * 864e5));
  const tasks = ins.openTasks(notes);
  const weekAgo = Date.now() - 7 * 864e5;
  const week = notes.filter(n => n.createdAt > weekAgo);
  const prevWeek = notes.filter(n => n.createdAt <= weekAgo && n.createdAt > weekAgo - 7 * 864e5);
  const avg = a => { const m = a.filter(n => n.mood).map(n => n.mood); return m.length ? m.reduce((x, y) => x + y, 0) / m.length : null; };
  const wAvg = avg(week), pAvg = avg(prevWeek);
  const bestNote = [...week].filter(n => n.mood).sort((a, b) => b.mood - a.mood)[0];
  const worstNote = [...week].filter(n => n.mood).sort((a, b) => a.mood - b.mood)[0];

  view.innerHTML = `
  <section class="card">
    <h3>📅 この1週間</h3>
    <div class="stats inner">
      <div><b>${week.length}</b><small>ノート</small></div>
      <div><b>${new Set(week.map(n => ins.dayKey(n.createdAt))).size}</b><small>記録した日</small></div>
      <div><b>${wAvg ? wAvg.toFixed(1) : '-'}</b><small>平均気分${wAvg && pAvg ? ` <span class="${wAvg >= pAvg ? 'up' : 'down'}">${wAvg >= pAvg ? '▲' : '▼'}${Math.abs(wAvg - pAvg).toFixed(1)}</span>` : ''}</small></div>
    </div>
    ${bestNote && worstNote && bestNote !== worstNote && bestNote.mood > worstNote.mood ? `
      <p class="small">いちばん良かった時 ${moodEmoji(bestNote.mood)}</p>${noteItem(bestNote)}
      <p class="small">いちばんしんどかった時 ${moodEmoji(worstNote.mood)}</p>${noteItem(worstNote)}
      <p class="muted small">→ 2つの違いは何だろう？</p>` : ''}
    <button class="btn" id="write-weekly">🔁 週次ふりかえりを書く</button>
  </section>

  <section class="card">
    <h3>📈 気分の推移（30日）</h3>
    ${hasMood ? moodChart(series) : '<p class="muted">ノートに気分を付けるとここにグラフが出ます。</p>'}
  </section>

  <section class="card">
    <h3>🏷 タグと気分</h3>
    ${tm.length ? `<p class="muted small">タグごとの気分の平均（全体平均との差）。※相関であって因果ではありません</p>
      <div class="bars">${tm.slice(0, 10).map(t => `<div class="bar-row"><span class="bar-label">#${esc(t.tag)} <small class="muted">${t.count}</small></span><span class="bar-track"><span class="bar ${t.diff >= 0 ? 'pos' : 'neg'}" style="width:${Math.min(100, Math.abs(t.diff) * 50)}%"></span></span><span class="bar-val">${t.diff >= 0 ? '+' : ''}${t.diff.toFixed(1)}</span></div>`).join('')}</div>`
      : '<p class="muted">タグと気分を付けたノートが増えると、「どんな作業の時に気分が良い/悪いか」が見えてきます。</p>'}
  </section>

  <section class="card">
    <h3>💬 最近よく出る言葉（30日）</h3>
    ${words.length ? `<div class="chips">${words.map(([w, c]) => `<button class="chip word" data-w="${esc(w)}" style="font-size:${Math.min(1.4, 0.85 + c * 0.06)}rem">${esc(w)} <small>${c}</small></button>`).join('')}</div>
      <p class="muted small">タップすると、その言葉を含むノートを検索します。</p>` : '<p class="muted">ノートが増えると、頭の中を占めている言葉が見えてきます。</p>'}
  </section>

  <section class="card">
    <h3>✅ まだやっていない「次にやること」</h3>
    ${tasks.length ? `<p class="muted small">${tasks.length}件 · 放置されているものは、本当に必要？</p>
      <ul class="task-list">${tasks.slice(0, 30).map((t, i) => `<li><label><input type="checkbox" data-i="${i}"> <span>${esc(t.text)}</span></label><a class="muted small" href="#/note/${t.note.id}">${fmtDate(t.note.createdAt)} · ${esc(noteTitle(t.note).slice(0, 20))}</a></li>`).join('')}</ul>`
      : '<p class="muted">開発ログの「- [ ] 」がここに集まります。</p>'}
  </section>`;

  $('#write-weekly').onclick = async () => { const n = newNote('weekly'); await saveNote(n); go(`#/note/${n.id}?new=1`); };
  $$('.word', view).forEach(b => b.onclick = () => { Object.assign(listState, { q: b.dataset.w, type: '', project: '', tag: '' }); go('#/notes'); });
  $$('.task-list input', view).forEach(cb => cb.onchange = async () => {
    const t = tasks[+cb.dataset.i];
    const lines = t.note.body.split('\n');
    lines[t.line] = lines[t.line].replace('[ ]', '[x]');
    t.note.body = lines.join('\n');
    await saveNote(t.note);
    cb.closest('li').classList.add('done');
    toast('完了にしました 🎉');
  });
}

// ---------- 設定 ----------
function toMarkdown() {
  const out = [`# 開発ノート エクスポート (${fmtDate(Date.now())})\n`];
  for (const p of state.projects) out.push(`\n# 🚀 ${p.name}\n\n> ${(p.purpose || '').replace(/\n/g, '\n> ')}\n`);
  const sorted = live().sort((a, b) => a.createdAt - b.createdAt);
  for (const n of sorted) {
    const p = projectOf(n.projectId);
    out.push(`\n---\n\n## ${TYPES[n.type]?.icon || ''} ${noteTitle(n)}\n\n- 日時: ${fmtDate(n.createdAt)} ${fmtTime(n.createdAt)}\n- 種類: ${TYPES[n.type]?.label || n.type}${p ? `\n- プロジェクト: ${p.name}` : ''}${n.mood ? `\n- 気分: ${moodEmoji(n.mood)} ${MOODS[n.mood - 1].l}` : ''}${(n.tags || []).length ? `\n- タグ: ${n.tags.map(t => '#' + t).join(' ')}` : ''}\n\n${(n.body || '').replace(/^(#{1,4})\s/gm, '$1## ')}\n`);
  }
  return out.join('');
}

async function renderSettings() {
  setTitle('設定'); setNav('');
  const trash = state.notes.filter(n => n.deletedAt).sort((a, b) => b.deletedAt - a.deletedAt);
  const onClaude = state.storage === 'claude';
  let persisted = onClaude; if (!onClaude) try { persisted = await navigator.storage?.persisted?.(); } catch {}
  let usage = ''; if (!onClaude) try { const e = await navigator.storage?.estimate?.(); if (e) usage = `${(e.usage / 1024).toFixed(0)} KB 使用中`; } catch {}
  const storageText = onClaude
    ? 'データはあなたの Claude アカウントに保存されています（本人だけが読めます）。どの端末から開いても同じノートが見られます。念のため、ときどきバックアップも書き出しておくと安心です。'
    : `データはこの端末のブラウザ内だけに保存されています（${usage}${persisted ? '・保護済み' : ''}）。<b>ときどきバックアップを書き出してください。</b>特にiPhoneでは、ブラウザがデータを消すことがあります。`;

  view.innerHTML = `
  <section class="card">
    <h3>🎨 表示</h3>
    <div class="seg wide" id="theme">${[['auto', '自動'], ['light', 'ライト'], ['dark', 'ダーク']].map(([v, l]) => `<button data-v="${v}" class="${settings.theme === v ? 'on' : ''}">${l}</button>`).join('')}</div>
  </section>
  <section class="card">
    <h3>🌿 週の目標</h3>
    <p class="muted small">「毎日」ではなく「週に◯日」。途切れても責めない仕組みです。</p>
    <div class="seg wide" id="goal">${[1, 2, 3, 4, 5, 6, 7].map(v => `<button data-v="${v}" class="${settings.weekGoal === v ? 'on' : ''}">${v}日</button>`).join('')}</div>
  </section>
  <section class="card">
    <h3>💾 データ</h3>
    <p class="muted small">${storageText}</p>
    <div class="row wrap">
      <button class="btn primary" id="exp-json">バックアップ (JSON)</button>
      <button class="btn" id="exp-md">Markdownで書き出し</button>
      <label class="btn">復元 (JSON)<input type="file" id="imp" accept="application/json,.json" hidden></label>
    </div>
    ${!persisted ? '<button class="link-btn" id="persist">ブラウザにデータの保護をお願いする</button>' : ''}
  </section>
  <section class="card">
    <h3>🗑 ゴミ箱 (${trash.length})</h3>
    ${trash.length ? trash.map(n => noteItem(n)).join('') + '<button class="btn danger small" id="empty-trash">ゴミ箱を空にする</button>' : '<p class="muted">空です</p>'}
  </section>
  <section class="card">
    <h3>ℹ️ このアプリについて</h3>
    <p class="small">作っているアプリの「経緯・目的・感想」を記録して、振り返りから気付きを得るためのノートです。無料・広告なし・データは自分だけのもの。</p>
    <p class="small muted">ヒント: 本文に <code>[[ノート名]]</code> と書くとノート同士をリンクでき、リンク先にはバックリンクが表示されます。<code>#タグ</code> も使えます。</p>
    <button class="link-btn danger" id="wipe">すべてのデータを削除</button>
  </section>`;

  $$('#theme button').forEach(b => b.onclick = () => { settings.theme = b.dataset.v; saveSettings(); applyTheme(); renderSettings(); });
  $$('#goal button').forEach(b => b.onclick = () => { settings.weekGoal = +b.dataset.v; saveSettings(); renderSettings(); });
  const stamp = new Date().toISOString().slice(0, 10);
  $('#exp-json').onclick = async () => { if (await saveFile(`devnote-backup-${stamp}.json`, JSON.stringify({ app: 'devnote', version: 1, exportedAt: Date.now(), projects: state.projects, notes: state.notes }, null, 2), 'application/json')) { settings.lastBackup = Date.now(); saveSettings(); } };
  $('#exp-md').onclick = () => saveFile(`devnote-${stamp}.md`, toMarkdown(), 'text/markdown');
  $('#imp').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      if (data.app !== 'devnote' || !Array.isArray(data.notes)) throw new Error('形式が違います');
      // id が同じものは更新日時が新しい方を残す（マージ）
      const merge = (cur, inc) => { const m = new Map(cur.map(x => [x.id, x])); let c = 0; for (const x of inc) { const o = m.get(x.id); if (!o || (x.updatedAt || 0) > (o.updatedAt || 0)) { m.set(x.id, x); c++; } } return [[...m.values()], c]; };
      const [ps, pc] = merge(state.projects, data.projects || []);
      const [ns, nc] = merge(state.notes, data.notes);
      await db.bulkPut('projects', ps); await db.bulkPut('notes', ns);
      state.projects = ps; state.notes = ns;
      toast(`復元しました（ノート${nc}件・プロジェクト${pc}件を更新）`);
      renderSettings();
    } catch (err) { toast('読み込めませんでした: ' + err.message); }
  };
  $('#persist')?.addEventListener('click', async () => { const ok = await requestPersist(); toast(ok ? '保護されました' : 'このブラウザでは保護できませんでした。バックアップを使ってください'); renderSettings(); });
  $('#empty-trash')?.addEventListener('click', async () => {
    if (!await ask(`ゴミ箱の${trash.length}件を完全に削除しますか？`, { ok: '完全に削除', danger: true })) return;
    for (const n of trash) await db.del('notes', n.id);
    state.notes = state.notes.filter(n => !n.deletedAt); renderSettings();
  });
  $('#wipe').onclick = async () => {
    if (!await ask('すべてのノートとプロジェクトを削除します。先にバックアップを取りましたか？', { ok: 'すべて削除', danger: true, typeToConfirm: '削除' })) return;
    await db.clear('notes'); await db.clear('projects'); state.notes = []; state.projects = []; toast('削除しました'); go('#/home');
  };
}

// ---------- テーマ ----------
const hostTheme = document.documentElement.getAttribute('data-theme'); // claude.ai が指定したテーマ
function applyTheme() {
  const t = settings.theme;
  if (t !== 'auto') document.documentElement.dataset.theme = t;
  else if (hostTheme) document.documentElement.dataset.theme = hostTheme;
  else document.documentElement.removeAttribute('data-theme');
}

// ---------- ルーティング ----------
async function route() {
  if (leaveEditor) { const f = leaveEditor; leaveEditor = null; await f(); }
  if (!embedded) currentPath = location.hash.slice(1) || '/home';
  closeSheet?.();
  const [path, qs] = currentPath.split('?');
  const params = new URLSearchParams(qs || '');
  const [, name, id] = path.split('/');
  document.body.dataset.view = name || 'home';
  window.scrollTo(0, 0);
  switch (name) {
    case 'notes': renderNotes(); break;
    case 'note': renderEditor(id, params); break;
    case 'projects': renderProjects(); break;
    case 'project': renderProject(id); break;
    case 'insights': renderInsights(); break;
    case 'settings': await renderSettings(); break;
    default: renderHome();
  }
}

async function init() {
  applyTheme();
  document.body.classList.toggle('embedded', embedded);
  view.innerHTML = '<p class="muted center loading">読み込み中…</p>';
  state.storage = await initStore();
  try {
    [state.notes, state.projects] = await Promise.all([db.all('notes'), db.all('projects')]);
  } catch (e) {
    console.error(e);
    view.innerHTML = '<div class="card"><h3>データを読み込めませんでした</h3><p class="muted">通信状態を確認して、ページを開き直してください。</p></div>';
    return;
  }
  state.projects.sort((a, b) => a.createdAt - b.createdAt);
  if (state.storage === 'local-fallback') setTimeout(() => toast('この表示では Claude に保存できないため、この端末に保存します'), 600);
  if (!embedded) window.addEventListener('hashchange', route);
  // #/... へのリンクは go() で処理（アーティファクト内でも動くように）
  document.addEventListener('click', e => {
    const a = e.target.closest('a[href^="#/"]');
    if (!a || e.defaultPrevented || e.metaKey || e.ctrlKey) return;
    e.preventDefault(); go(a.getAttribute('href'));
  });
  $('#fab').onclick = () => openNewNoteSheet(currentPath.startsWith('/project/') ? { projectId: currentPath.split('/')[2] } : {});
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { if (closeSheet) closeSheet(); else document.body.classList.remove('focus'); }
  });
  window.addEventListener('pagehide', () => flushEditor?.());
  document.addEventListener('visibilitychange', () => { if (document.hidden) flushEditor?.(); }); // アプリを閉じる前に入力途中の内容を保存
  route();
  if (state.notes.length > 5) requestPersist();
  if (!embedded && 'serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('./sw.js').catch(() => {});
}
init();

</script>
